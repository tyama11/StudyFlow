version: 2
updates:
  # npm依存パッケージの更新（メジャー更新も含めてまとめて最新追従）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint が <6.1.0 を要求するため、TypeScript 6.1.0 以上を無視
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]

  # GitHub Actions ワークフローの更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
