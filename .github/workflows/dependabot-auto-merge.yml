name: "Dependabot Auto-Approve & Auto-Merge"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # 手動でも全 Dependabot PR の自動承認・自動マージを実行可能にする
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Approve and Enable Auto-Merge
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Processing PR: $PR_URL"
            gh pr review --approve "$PR_URL" || true
            gh pr merge --auto --squash "$PR_URL" || true
          else
            echo "Processing all open Dependabot PRs..."
            prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,url,author -q '.[] | select(.author.login | test("dependabot")) | .url')
            if [ -z "$prs" ]; then
              echo "No open Dependabot PRs found."
            else
              for url in $prs; do
                echo "Approving and enabling auto-merge for: $url"
                gh pr review --approve "$url" || true
                gh pr merge --auto --squash "$url" || true
              done
            fi
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
