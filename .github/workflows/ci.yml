name: "CI (Type Check, Lint, Tests & Build)"

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # 1. TypeScript 型チェック
      - name: TypeScript Type Check
        id: typecheck
        run: |
          mkdir -p ci-logs
          npx tsc --noEmit > ci-logs/tsc.log 2>&1 || (cat ci-logs/tsc.log && exit 1)

      # 2. ESLint (コード品質・スタイル)
      - name: Lint (ESLint)
        run: npm run lint

      # 3. ユニットテスト + カバレッジ
      - name: Run Unit Tests with Coverage
        run: npm run coverage

      - name: Upload CI Logs on Failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-diagnostic-logs
          path: ci-logs/
          retention-days: 1

      # 4. カバレッジレポートをArtifactとして保存
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # 5. フロントエンドビルド確認
      - name: Verify Frontend Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
